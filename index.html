<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Payslip Portal – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="login-page">

  <div class="login-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="login-wrapper">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">
          <img src="logo.png" alt="Ealkay Logo" style="width:36px;height:36px;object-fit:contain;border-radius:6px;"/>
        </div>
        <div class="brand-text">
          <span class="brand-name">Payslip <strong>Portal</strong></span>
          <span class="brand-sub">Ealkay Consulting Pvt. Ltd.</span>
        </div>
      </div>

      <div class="login-divider"></div>

      <h1>Welcome back</h1>
      <p class="login-subtitle">Sign in to access your payslips</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            Email Address
          </label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required/>
        </div>

        <div class="field">
          <label for="password">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Password
          </label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required/>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <span id="loginSpinner" class="spinner hidden"></span>
        </button>
      </form>

      <p class="login-footer">Secured by <strong>Ealkay</strong> · Payslip Portal v1.0</p>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
